---
name: Build and Push Docker Image
description: Builds the benthos-umh multi-arch Docker image with Depot and pushes it to ghcr.io with semver, branch, PR, and sha tags.

inputs:
  registry:
    description: Container registry
    required: false
    default: ghcr.io
  image-name:
    description: Image name (owner/repo)
    required: true
  github-token:
    description: Token used to log in to the container registry
    required: true
  depot-project-id:
    description: Depot project ID
    required: true
  depot-token:
    description: Depot API token
    required: true
  version:
    description: Release version (vX.Y.Z). If set, the image is tagged X.Y.Z only; release.yml moves X.Y and latest after publishing.
    required: false
    default: ""

outputs:
  tags:
    description: Newline-separated docker tags applied to the pushed image
    value: ${{ steps.meta.outputs.tags }}
  version:
    description: Primary version tag chosen by metadata-action
    value: ${{ steps.meta.outputs.version }}

runs:
  using: composite
  steps:
    - name: Setup Depot
      uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
      with:
        images: |
          ${{ inputs.registry }}/${{ inputs.image-name }}
        flavor: latest=false
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          type=ref,event=branch,enable=${{ inputs.version == '' }}
          type=ref,event=pr
          type=sha,enable=${{ inputs.version == '' }}

    # Depot occasionally drops the build stream mid-`go build` ("keepalive ping
    # failed to receive ACK"), failing the job with nothing wrong in the tree.
    # toJSON keeps multi-line tags/labels on one line; wretry parses `with:` as YAML
    # Pinned to the JS action directly: the v3.8.0 composite fetches it by tag.
    - name: Build and Push Docker Image
      uses: Wandalen/wretry.action@71a909ebf09f3ffdc6f42a17bd54ecb43481da49 # v3.8.0_js_action
      with:
        action: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        env_context: ${{ toJSON(env) }}
        attempt_limit: 2
        attempt_delay: 15000
        with: |
          project: ${{ inputs.depot-project-id }}
          # Build the checked-out commit. Depot's default is the commit that
          # triggered the run, which for a release is not the one it ships.
          context: .
          token: ${{ inputs.depot-token }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ toJSON(steps.meta.outputs.tags) }}
          labels: ${{ toJSON(steps.meta.outputs.labels) }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          provenance: false
          file: ./Dockerfile
