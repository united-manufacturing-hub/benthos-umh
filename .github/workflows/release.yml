---
name: Release

# Merging the release PR (prepare-release.yml) releases: resolve -> build ->
# tag and publish -> umh-core and ManagementConsole PRs. The release ships the
# staging commit the release PR was generated from (see resolve-release.sh).
# The tag is created only after the build: the Go module proxy caches a tag
# once fetched, so a version is never reused. If a job fails, re-run the failed
# jobs. CLAUDE.md "Releases" lists what to do when that does not help.
on:
  push:
    branches: [staging]
    # Only a push that adds a version file can be a release PR merge.
    paths: [".changelog/v*.md"]

# One release at a time. Never cancel a running release halfway.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      merge: ${{ steps.resolve.outputs.merge }}
      base: ${{ steps.resolve.outputs.base }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the release commit and version
        id: resolve
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: .github/scripts/resolve-release.sh

  build-docker:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    permissions:
      packages: write
      contents: read
    timeout-minutes: 60
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.base }}
      - name: Build and Push Docker Image
        uses: ./.github/actions/build-docker
        with:
          image-name: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          depot-project-id: ${{ secrets.DEPOT_PROJECT_ID }}
          depot-token: ${{ secrets.DEPOT_TOKEN }}
          version: ${{ needs.resolve.outputs.version }}

  build-binaries:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.base }}
      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Set up Build Environment
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV
          echo "APP_VERSION=${VERSION#v}" >> $GITHUB_ENV

          if [ "${{ matrix.goos }}" == "windows" ]; then
            FILE_EXTENSION=".exe"
          else
            FILE_EXTENSION=""
          fi

          echo "OUTPUT_NAME=benthos-${{ matrix.goos }}-${{ matrix.goarch }}${FILE_EXTENSION}" >> $GITHUB_ENV

      - name: Build Binary
        run: |
          mkdir -p ./dist
          GOOS=${{ env.GOOS }} GOARCH=${{ env.GOARCH }} \
            CGO_ENABLED=0 GOPROXY=https://golangproxy.umh.app,https://proxy.golang.org,direct \
            go build \
            -ldflags "-s -w \
            -X github.com/redpanda-data/benthos/v4/internal/cli.Version=${{ env.APP_VERSION }} \
            -X github.com/redpanda-data/benthos/v4/internal/cli.DateBuilt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ./dist/${{ env.OUTPUT_NAME }} \
            cmd/benthos/main.go

      # A re-run of this job replaces the binary of the earlier attempt.
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./dist/${{ env.OUTPUT_NAME }}
          overwrite: true

  release:
    needs: [resolve, build-binaries, build-docker]
    permissions:
      contents: write
      packages: write
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ needs.resolve.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      # The release PR merge holds the version file; the base does not.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.merge }}

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binary-*
          path: ./artifacts
          merge-multiple: true

      # The tag is created first and the release on top of it: creating a
      # release whose target commit has other workflow files than staging needs
      # a token that may change workflows, which GITHUB_TOKEN never may. Both
      # steps skip what exists, so a re-run continues where a failed run stopped.
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ needs.resolve.outputs.base }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 \
            || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$BASE" >/dev/null
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Drop the "## [vX.Y.Z]" heading; the release title already shows it.
            tail -n +2 ".changelog/$TAG.md" > notes.md
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" ./artifacts/* --clobber

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y and latest move only once the release is published.
      - name: Tag the image as X.Y and latest
        run: |
          version="${TAG#v}"
          docker buildx imagetools create -t "$IMAGE:${version%.*}" -t "$IMAGE:latest" "$IMAGE:$version"

  update-umh-core:
    needs: [resolve, release]
    # Checks out benthos-umh with github.token. Writes to umh-core and
    # ManagementConsole go through a GitHub App token.
    uses: ./.github/workflows/update-umh-core-version.yml
    with:
      tag: ${{ needs.resolve.outputs.version }}
    secrets: inherit

  # Tells whoever merged the release PR that the release failed.
  alert:
    needs: [resolve, build-docker, build-binaries, release, update-umh-core]
    if: failure() && needs.resolve.outputs.merge != ''
    # Only calls the GitHub API, so the faster-starting GitHub runner is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE: ${{ needs.resolve.outputs.merge }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$MERGE/pulls" --jq '.[0].number')
          merged_by=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .merged_by.login)
          gh pr comment "$pr" --body "@$merged_by The release failed: $RUN_URL. Re-run the failed jobs; see CLAUDE.md, \"When a release fails\"."
