---
name: Release

# A published GitHub release on staging runs validate -> test -> build -> release
# -> update-umh-core. Nothing is built or published until validate and the full
# test suite pass. CLAUDE.md "Branches and pull requests" lists how to cut one.
on:
  release:
    types: [published]

# One release at a time. Never cancel a running release halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    # Prereleases are skipped, as in ManagementConsole. CI already pushes a
    # per-PR image for testing.
    if: >-
      startsWith(github.event.release.tag_name, 'v') &&
      !github.event.release.prerelease
    runs-on: depot-ubuntu-24.04
    permissions:
      # Needed to turn a failed release back into a draft.
      contents: write
    steps:
      # The release event checks out the tag, so GITHUB_SHA is the tagged commit.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # The checks after this one also run when it fails, so one run reports every problem.
      - name: Check the tag is the staging tip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          staging="$(gh api "repos/$GITHUB_REPOSITORY/commits/staging" --jq .sha)"
          if [ "$GITHUB_SHA" != "$staging" ]; then
            echo "::error::Tag $TAG ($GITHUB_SHA) is not the staging tip ($staging). Create the release with --target staging."
            exit 1
          fi

      - name: Check the title equals the tag
        if: ${{ !cancelled() }}
        env:
          TAG: ${{ github.event.release.tag_name }}
          TITLE: ${{ github.event.release.name }}
        run: |
          if [ "$TITLE" != "$TAG" ]; then
            echo "::error::Release title '$TITLE' must equal the tag '$TAG'."
            exit 1
          fi

      - name: Check the changelog is cut
        if: ${{ !cancelled() }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          failed=0
          # The first line is the "## [vX.Y.Z]" heading; the entries follow it.
          if [ ! -f ".changelog/$TAG.md" ] || ! awk 'NR > 1 && NF { found = 1; exit } END { exit !found }' ".changelog/$TAG.md"; then
            echo "::error::.changelog/$TAG.md is missing or empty. Run make release-changelog VERSION=$TAG and merge it into staging first."
            failed=1
          fi
          # A fragment left here belongs to a PR merged after the changelog PR.
          # Its change would ship without appearing in these release notes.
          # changie batch cannot add it: it refuses an existing version file, and --force overwrites the file.
          if [ -n "$(find .changelog/unreleased -type f ! -name .gitkeep)" ]; then
            echo "::error::.changelog/unreleased/ is not empty. Copy each fragment's entry into .changelog/$TAG.md by hand, delete the fragments, run ./.tools/changie merge, and merge that into staging first."
            failed=1
          fi
          exit "$failed"

      - name: Turn the release back into a draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft

  test:
    needs: validate
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      full_run: true
    secrets: inherit

  build-docker:
    needs: test
    permissions:
      packages: write
      contents: read
    timeout-minutes: 60
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Build and Push Docker Image
        uses: ./.github/actions/build-docker
        with:
          image-name: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          depot-project-id: ${{ secrets.DEPOT_PROJECT_ID }}
          depot-token: ${{ secrets.DEPOT_TOKEN }}

  build-binaries:
    needs: test
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Set up Build Environment
        run: |
          VERSION="${{ github.ref_name }}"
          echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV
          echo "APP_VERSION=${VERSION#v}" >> $GITHUB_ENV

          if [ "${{ matrix.goos }}" == "windows" ]; then
            FILE_EXTENSION=".exe"
          else
            FILE_EXTENSION=""
          fi

          echo "OUTPUT_NAME=benthos-${{ matrix.goos }}-${{ matrix.goarch }}${FILE_EXTENSION}" >> $GITHUB_ENV

      - name: Build Binary
        run: |
          mkdir -p ./dist
          GOOS=${{ env.GOOS }} GOARCH=${{ env.GOARCH }} \
            CGO_ENABLED=0 GOPROXY=https://golangproxy.umh.app,https://proxy.golang.org,direct \
            go build \
            -ldflags "-s -w \
            -X github.com/redpanda-data/benthos/v4/internal/cli.Version=${{ env.APP_VERSION }} \
            -X github.com/redpanda-data/benthos/v4/internal/cli.DateBuilt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ./dist/${{ env.OUTPUT_NAME }} \
            cmd/benthos/main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifact-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist/${{ env.OUTPUT_NAME }}

  release:
    needs: [build-binaries, build-docker]
    permissions:
      contents: write
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Drop the "## [vX.Y.Z]" heading; the release title already shows it.
          BODY=$(tail -n +2 ".changelog/$TAG.md")
          {
            echo "RELEASE_BODY<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "artifact-*-${{ github.run_id }}-${{ github.run_attempt }}"
          path: ./artifacts

      - name: Create or Update Release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          tag: ${{ github.ref_name }}
          artifacts: "./artifacts/artifact-*-${{ github.run_id }}-${{ github.run_attempt }}/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          body: ${{ env.RELEASE_BODY }}

  # A failed test or build leaves a published release with no image or binaries.
  # Turn it back into a draft, as validate does for its own failures.
  revert-to-draft:
    needs: [validate, test, build-docker, build-binaries, release]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Turn the release back into a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft

  update-umh-core:
    needs: release
    if: needs.release.result == 'success'
    uses: ./.github/workflows/update-umh-core-version.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
