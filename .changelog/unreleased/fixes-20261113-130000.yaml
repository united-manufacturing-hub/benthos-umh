kind: fixes
body: Updated the OpenTelemetry log SDK (v0.19.0 to v0.21.0) and the Redpanda OpenTelemetry exporter that uses it, so a full log export buffer can no longer make the batch log processor spin and use up the CPU. benthos-umh itself does not set up such a processor, so only a custom setup that exports OpenTelemetry logs was exposed (CVE-2026-81872). Images built before the next benthos-umh release, including the benthos bundled in the current umh-core, still contain the older version (ENG-6378)
time: 2026-11-13T13:00:00.000000+01:00
