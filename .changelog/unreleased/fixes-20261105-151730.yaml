kind: fixes
body: Sparkplug B input now writes Bytes, File and array metrics to the UNS as base64 strings, and names their datatype in spb_datatype. Before, it dropped them without a warning. DataSet and Template metrics are still not supported, and the input now logs a warning when it drops one (ENG-7597)
