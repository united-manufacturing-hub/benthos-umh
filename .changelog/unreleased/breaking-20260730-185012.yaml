kind: breaking
body: The historian output reports dropped messages at error level, one line per drop reason per batch, naming the reason, how many of the batch it accounted for, an example topic and the fix, so a bridge discarding data no longer looks healthy. The reasonless "dropped all N message(s)" warning is gone and the missing_value_or_timestamp reason is split into missing_value and missing_timestamp (ENG-5414)
