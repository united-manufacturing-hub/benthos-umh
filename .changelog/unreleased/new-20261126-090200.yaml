kind: new
body: The OPC UA output can run a programmable handshake (handshake.script) instead of the fixed read-after-write check. You write the machine's own acknowledgment procedure as a small JavaScript script, with onSuccess and onError cleanup blocks and the deadlines maxScriptRuntimeMs, maxOnSuccessRuntimeMs and maxOnErrorRuntimeMs, and the output runs it once per message, issuing opcua.read, opcua.write, opcua.wait_until and opcua.call_method operations. The script ends the message as delivered, not ready, transient or persistent, so the write flow can retry or dead-letter it. The fixed read-back fields handshake.enabled, handshake.readbackTimeoutMs, handshake.maxWriteAttempts and handshake.timeBetweenRetriesMs are deprecated and still work unchanged; a config that sets deprecated and programmable fields together is refused when it is loaded (ENG-8130)
