kind: fixes
body: The OPC UA output now refuses four handshake settings at startup that it used to accept and then behave badly on. handshake.maxWriteAttempts of 0 turned the output into a silent acknowledger - every message reported as written, nothing sent to the machine, and the read-back that exists to catch that never ran. handshake.readbackTimeoutMs of 0 made every read-back time out before it began, so no message was ever confirmed. And handshake.readbackTimeoutMs or handshake.timeBetweenRetriesMs longer than an hour is now refused as the unit mistake it almost always is, matching the programmable handshake. If one of these is in your config the bridge will not start until you correct it, which is the point: all four used to fail quietly while running (ENG-8172)
