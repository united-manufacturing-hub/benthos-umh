kind: new
body: The JavaScript `cache` in `nodered_js` and `tag_processor` now keeps state correct under retries and out-of-order messages: each write carries a `timestamp_ms` and older writes are dropped automatically. Supports a persistent disk-backed backend with TTL and cache sharing between processors (ENG-3463)
