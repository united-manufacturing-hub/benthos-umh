kind: new
body: The JavaScript cache used by `nodered_js` and `tag_processor` gains a persistent disk-backed backend with TTL, shared caches between processors via a `name` field, automatic locking so plain `cache.get`/`cache.set` stay correct under concurrent messages, replay dedup that skips cache writes when inputs like UNS or Kafka redeliver a message, and `cache_keys` / `cache_disk_bytes` metrics (ENG-3463)
