kind: improvements
body: The historian output reports dropped messages at error level, one aggregated line per reason per batch, naming the reason, how much of the batch it accounted for, an example topic and the fix. Reporting starts with the first batch rather than after 30 seconds, and missing_value_or_timestamp is split into missing_value and missing_timestamp (ENG-5414)
