kind: fixes
body: 'OPC UA input and output: fixed vulnerabilities that let the OPC UA server a bridge connects to, or anyone who can answer in its place, crash the bridge with one malformed answer, or make it reserve up to 4 GB of memory for every chunk it reads. Some of these work before the server has proven its identity, so a pinned server certificate does not protect against them. On 32-bit devices, such as a 32-bit Raspberry Pi, a crafted length in any message could also crash the bridge ([CWE-129](https://cwe.mitre.org/data/definitions/129.html), [CWE-674](https://cwe.mitre.org/data/definitions/674.html), [CWE-681](https://cwe.mitre.org/data/definitions/681.html)). Advisories: [GHSA-7m4c-fvxf-qg64](https://github.com/gopcua/opcua/security/advisories/GHSA-7m4c-fvxf-qg64), [GHSA-9gf7-v5cx-7gvf](https://github.com/gopcua/opcua/security/advisories/GHSA-9gf7-v5cx-7gvf). Affects benthos-umh v0.17.1 and earlier, including the version in the current umh-core. Update now; this fix might not be in a umh-core release yet'
time: 2026-11-27T13:24:42.000000+01:00
