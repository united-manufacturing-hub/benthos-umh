kind: fixes
body: "OPC UA: username login works on Siemens PLCs that list the old Basic128Rsa15 policy first for user names, such as the S7-1200 G2 and S7-1500 with a 3072-bit certificate. The bridge failed with `remote key size should be 128-256 bytes`; it now uses the policy matching the connection's security policy"
