kind: fixes
body: Updated the OpenTelemetry OTLP trace exporters (v1.44.0 to v1.45.0), so a verbose OpenTelemetry logger can no longer write the collector endpoint URL to the log. Only a tracing setup with a custom verbose OpenTelemetry logger was exposed (CVE-2026-81870). Images built before the next benthos-umh release, including the benthos bundled in the current umh-core, still contain the older exporters (ENG-6614)
time: 2026-11-10T16:00:00.000000+01:00
