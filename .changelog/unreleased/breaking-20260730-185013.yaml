kind: breaking
body: A historian bridge now refuses any batch containing a message for a data contract other than its configured data_contract_name, instead of discarding those messages silently. Nothing in a refused batch is written, so reported write throughput is the number of rows stored rather than the number of messages accepted, and the bridge reports as degraded with an error naming the contracts that arrived and the umh_topics pattern to narrow to. Refused messages are not retried. Bridges subscribed to more than their own contract will store nothing after upgrading until their subscription is narrowed (ENG-5413)
