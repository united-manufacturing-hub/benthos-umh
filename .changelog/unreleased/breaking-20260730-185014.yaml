kind: breaking
body: The historian output only stores schema-validated data. A versioned data contract whose schema was bypassed is always rejected; an unversioned contract such as _historian is rejected unless allow_unvalidated_data is set, which also lets its tags change datatype instead of being dropped as poison. Relational payloads carrying fields beyond value and timestamp_ms are rejected as not_timeseries (ENG-5419, ENG-5415, ENG-5468)
time: 2026-07-30T18:50:14.000000+02:00
