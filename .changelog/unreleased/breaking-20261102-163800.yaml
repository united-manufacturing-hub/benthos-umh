kind: breaking
body: 'Modbus, S7, Ethernet/IP and sensorconnect inputs: a text value that looks like a number now reaches the UNS as text. Before, a STRING tag or S7 CHAR holding `1234` arrived as the number 1234, and a 17-digit value lost its last digits. For a tag that changes from number to text, the historian drops every new row. To keep such a tag a number, set `msg.meta.datatype = "number"` for it in the tag processor. To store both types instead, set `allow_datatype_changes: true` on the historian output. A processor that reads the payload before the tag processor now sees `"1234"` with quotes. Ethernet/IP arrays now arrive as `[1,2,3]` instead of `[1 2 3]`, with `null` for a NaN or infinite element.'
time: 2026-11-02T16:38:00.000000+01:00
